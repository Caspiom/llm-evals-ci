[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-evals-ci"
version = "0.1.0"
description = "Suite de avaliação de LLM com gate de regressão em CI"
requires-python = ">=3.11"
dependencies = []  # núcleo só com stdlib: setup < 15 min e CI barato

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llm-evals = "llm_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
